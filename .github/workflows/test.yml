name: test

on:
  pull_request:
  push:
    branches: [main]

jobs:
  gatekeeper:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # WebCrypto の Ed25519 が要るので Node 24 以上。npm install は不要（外部依存なし）
      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      # テストは PR ごとに増えるので、名前を列挙せず glob で拾う
      - name: Node のテストを回す
        run: |
          shopt -s nullglob
          files=(gatekeeper/test_*.mjs web/test_*.mjs)
          if [ ${#files[@]} -eq 0 ]; then
            echo "テストファイルが1つも無い"
            exit 1
          fi
          fail=0
          for f in "${files[@]}"; do
            echo "::group::$f"
            node "$f" || fail=1
            echo "::endgroup::"
          done
          exit $fail
        shell: bash

  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # 作品本体は Python 標準ライブラリのみ。pip install は不要
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      # テストのあるディレクトリは増えるので、探して回す
      - name: Python のテストを回す
        run: |
          dirs=$(find . -name 'test_*.py' -not -path './node_modules/*' \
                 -exec dirname {} \; | sort -u)
          if [ -z "$dirs" ]; then
            echo "テストファイルが1つも無い"
            exit 1
          fi
          fail=0
          for d in $dirs; do
            echo "::group::$d"
            python3 -m unittest discover -s "$d" -p 'test_*.py' -v || fail=1
            echo "::endgroup::"
          done
          exit $fail
        shell: bash
